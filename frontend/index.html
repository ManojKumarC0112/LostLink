<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LostLink - Unix & Shell Scripting Campus Lost & Found System</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const API_BASE = window.location.origin.includes(':5000') 
      ? window.location.origin 
      : 'http://localhost:5000';

    // App Component
    function App() {
      const CAMPUS_USERS = [
        { username: 'admin', role: 'admin', full_name: 'Campus Admin', email: 'admin@campus.edu', phone: '+91-9876543210' },
        { username: 'security_desk', role: 'staff', full_name: 'Chief Security Officer', email: 'security@campus.edu', phone: '+91-9876543211' },
        { username: 'rahul_s', role: 'student', full_name: 'Rahul Sharma', email: 'rahul.s@student.campus.edu', phone: '+91-9876543212' },
        { username: 'priya_p', role: 'student', full_name: 'Priya Patel', email: 'priya.p@student.campus.edu', phone: '+91-9876543213' },
        { username: 'amit_k', role: 'student', full_name: 'Amit Kumar', email: 'amit.k@student.campus.edu', phone: '+91-9876543214' },
        { username: 'sneha_r', role: 'student', full_name: 'Sneha Rao', email: 'sneha.r@student.campus.edu', phone: '+91-9876543215' }
      ];

      const [activeTab, setActiveTab] = useState('dashboard');
      const [user, setUser] = useState(CAMPUS_USERS[0]);
      const [stats, setStats] = useState(null);
      const [lostItems, setLostItems] = useState([]);
      const [foundItems, setFoundItems] = useState([]);
      const [claims, setClaims] = useState([]);
      const [matches, setMatches] = useState([]);
      const [systemInfo, setSystemInfo] = useState(null);
      const [backups, setBackups] = useState([]);
      const [reportsList, setReportsList] = useState([]);
      const [logs, setLogs] = useState([]);
      const [loading, setLoading] = useState(false);
      const [serverConnected, setServerConnected] = useState(true);
      const [notification, setNotification] = useState(null);

      // Search filters
      const [searchQuery, setSearchQuery] = useState('');
      const [searchCategory, setSearchCategory] = useState('all');
      const [searchLocation, setSearchLocation] = useState('all');
      const [searchResults, setSearchResults] = useState(null);

      // Modals
      const [showLostModal, setShowLostModal] = useState(false);
      const [showFoundModal, setShowFoundModal] = useState(false);
      const [showClaimModal, setShowClaimModal] = useState(null);

      // Forms
      const [newLost, setNewLost] = useState({ 
        title: '', 
        category: 'Electronics', 
        description: '', 
        location: '', 
        reported_by: 'admin',
        email: 'admin@campus.edu',
        contact_phone: '+91-9876543210', 
        date: new Date().toISOString().split('T')[0] 
      });

      const [newFound, setNewFound] = useState({ 
        title: '', 
        category: 'Electronics', 
        description: '', 
        location: '', 
        reported_by: 'security_desk',
        email: 'security@campus.edu',
        contact_phone: '+91-9876543211', 
        date: new Date().toISOString().split('T')[0] 
      });

      const [claimUser, setClaimUser] = useState('admin');
      const [claimProof, setClaimProof] = useState('');
      const [claimPhone, setClaimPhone] = useState('+91-9876543210');

      const openLostModal = () => {
        setNewLost({
          title: '',
          category: 'Electronics',
          description: '',
          location: '',
          reported_by: user.username,
          email: user.email || `${user.username}@campus.edu`,
          contact_phone: user.phone || '+91-9876543210',
          date: new Date().toISOString().split('T')[0]
        });
        setShowLostModal(true);
      };

      const openFoundModal = () => {
        setNewFound({
          title: '',
          category: 'Electronics',
          description: '',
          location: '',
          reported_by: user.role === 'admin' ? 'security_desk' : user.username,
          email: user.role === 'admin' ? 'security@campus.edu' : (user.email || `${user.username}@campus.edu`),
          contact_phone: user.role === 'admin' ? '+91-9876543211' : (user.phone || '+91-9876543210'),
          date: new Date().toISOString().split('T')[0]
        });
        setShowFoundModal(true);
      };

      const openClaimModal = (item) => {
        setShowClaimModal(item);
        setClaimUser(user.username);
        setClaimPhone(user.phone || '+91-9876543210');
        setClaimProof('');
      };

      const notify = (msg, type = 'success') => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 4000);
      };

      const fetchDashboardData = async () => {
        setLoading(true);
        try {
          const [sRes, lRes, fRes, cRes] = await Promise.all([
            fetch(`${API_BASE}/api/stats`).then(r => r.json()).catch(() => null),
            fetch(`${API_BASE}/api/items/lost`).then(r => r.json()).catch(() => []),
            fetch(`${API_BASE}/api/items/found`).then(r => r.json()).catch(() => []),
            fetch(`${API_BASE}/api/claims`).then(r => r.json()).catch(() => [])
          ]);
          if (sRes) setStats(sRes);
          if (lRes) setLostItems(lRes);
          if (fRes) setFoundItems(fRes);
          if (cRes) setClaims(cRes);
          setServerConnected(Boolean(sRes || lRes.length || fRes.length));
        } catch (err) {
          console.error(err);
        }
        setLoading(false);
      };

      const fetchMatches = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/matches?threshold=25`).then(r => r.json());
          setMatches(res || []);
        } catch (e) { console.error(e); }
      };

      const fetchSystem = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/system`).then(r => r.json());
          setSystemInfo(res || null);
        } catch (e) { console.error(e); }
      };

      const fetchBackups = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/backups`).then(r => r.json());
          setBackups(res || []);
        } catch (e) { console.error(e); }
      };

      const fetchReports = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/reports`).then(r => r.json());
          setReportsList(res || []);
        } catch (e) { console.error(e); }
      };

      const fetchLogs = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/logs?limit=40`).then(r => r.json());
          setLogs(res || []);
        } catch (e) { console.error(e); }
      };

      useEffect(() => {
        fetchDashboardData();
      }, []);

      useEffect(() => {
        if (activeTab === 'matches') fetchMatches();
        if (activeTab === 'system') fetchSystem();
        if (activeTab === 'reports') fetchReports();
        if (activeTab === 'backups') fetchBackups();
        if (activeTab === 'logs') fetchLogs();
      }, [activeTab]);

      // Handle Adding Items
      const handleAddLost = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch(`${API_BASE}/api/items/lost`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              ...newLost, 
              reported_by: newLost.reported_by || user.username, 
              email: newLost.email || `${user.username}@campus.edu`,
              contact_phone: newLost.contact_phone || '+91-9876543210'
            })
          }).then(r => r.json());
          if (res.success) {
            notify(`Lost item registered! ID: ${res.item_id} (Reported by: ${newLost.reported_by || user.username})`);
            setShowLostModal(false);
            fetchDashboardData();
          } else {
            notify(res.message || 'Error adding item', 'error');
          }
        } catch (err) {
          notify('Server connection error', 'error');
        }
      };

      const handleAddFound = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch(`${API_BASE}/api/items/found`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              ...newFound, 
              reported_by: newFound.reported_by || user.username, 
              email: newFound.email || `${user.username}@campus.edu`,
              contact_phone: newFound.contact_phone || '+91-9876543211'
            })
          }).then(r => r.json());
          if (res.success) {
            notify(`Found item logged! ID: ${res.item_id} (Logged by: ${newFound.reported_by || user.username})`);
            setShowFoundModal(false);
            fetchDashboardData();
          } else {
            notify(res.message || 'Error adding item', 'error');
          }
        } catch (err) {
          notify('Server connection error', 'error');
        }
      };

      // Handle Claim Submission
      const handleSubmitClaim = async (e) => {
        e.preventDefault();
        if (!showClaimModal) return;
        try {
          const res = await fetch(`${API_BASE}/api/claims`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              found_item_id: showClaimModal.item_id,
              claimed_by: claimUser || user.username,
              proof_details: claimProof,
              claimant_phone: claimPhone
            })
          }).then(r => r.json());
          if (res.success) {
            notify(`Claim submitted! Claim ID: ${res.claim_id} (Claimed by: ${claimUser || user.username})`);
            setShowClaimModal(null);
            setClaimProof('');
            fetchDashboardData();
          } else {
            notify(res.message || 'Error submitting claim', 'error');
          }
        } catch (err) {
          notify('Server connection error', 'error');
        }
      };

      // Handle Review Claim
      const handleReviewClaim = async (claimId, decision) => {
        try {
          const res = await fetch(`${API_BASE}/api/claims/review`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              claim_id: claimId,
              decision,
              reviewer: user.username,
              notes: `Claim marked as ${decision} by ${user.username}`
            })
          }).then(r => r.json());
          if (res.success) {
            notify(`Claim ${claimId} ${decision}d successfully!`);
            fetchDashboardData();
          } else {
            notify(res.message || 'Review failed', 'error');
          }
        } catch (err) {
          notify('Server error during claim review', 'error');
        }
      };

      // Trigger Backup
      const handleTriggerBackup = async () => {
        try {
          notify('Executing Bash backup_restore.sh script...');
          const res = await fetch(`${API_BASE}/api/backups`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ retention_days: 7, user: user.username })
          }).then(r => r.json());
          if (res.success) {
            notify(`Backup created: ${res.archive_name} (${res.size})`);
            fetchBackups();
          } else {
            notify('Backup creation failed', 'error');
          }
        } catch (err) {
          notify('Server error triggering backup', 'error');
        }
      };

      // Trigger Report Generation
      const handleGenerateReport = async (rtype) => {
        try {
          notify(`Generating ${rtype} report via Bash report_generator.sh...`);
          const res = await fetch(`${API_BASE}/api/reports/generate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: rtype, user: user.username })
          }).then(r => r.json());
          if (res.success) {
            notify(`${rtype.toUpperCase()} report generated in reports/ folder!`);
            fetchReports();
          } else {
            notify('Report generation failed', 'error');
          }
        } catch (err) {
          notify('Server error generating report', 'error');
        }
      };

      // Execute Search
      const handleSearch = async (e) => {
        e && e.preventDefault();
        try {
          const url = `${API_BASE}/api/search?q=${encodeURIComponent(searchQuery)}&category=${encodeURIComponent(searchCategory)}&location=${encodeURIComponent(searchLocation)}`;
          const res = await fetch(url).then(r => r.json());
          setSearchResults(res || []);
        } catch (err) {
          console.error(err);
        }
      };

      return (
        <div className="flex h-screen overflow-hidden bg-slate-50">
          {/* Notification Toast */}
          {notification && (
            <div className={`fixed bottom-6 right-6 z-50 px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 transition-all ${
              notification.type === 'error' ? 'bg-red-600 text-white' : 'bg-slate-900 text-white'
            }`}>
              <span className="font-semibold text-sm">{notification.msg}</span>
            </div>
          )}

          {/* Sidebar */}
          <aside className="w-64 bg-slate-900 flex flex-col justify-between text-slate-300 select-none shadow-xl border-r border-slate-800">
            <div>
              {/* Logo & System Header */}
              <div className="p-5 border-b border-slate-800">
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-blue-500/30">
                    L
                  </div>
                  <div>
                    <h1 className="text-white font-bold text-lg tracking-tight">LostLink</h1>
                    <span className="text-[10px] text-blue-400 font-mono tracking-wider uppercase font-semibold">Unix / Bash Core</span>
                  </div>
                </div>
              </div>

              {/* Navigation Links */}
              <nav className="p-3 space-y-1 text-sm font-medium">
                {[
                  { id: 'dashboard', label: 'Dashboard', icon: '📊' },
                  { id: 'lost', label: 'Lost Items', icon: '🔍', count: lostItems.length },
                  { id: 'found', label: 'Found Items', icon: '📦', count: foundItems.length },
                  { id: 'matches', label: 'Smart Matching', icon: '⚡', badge: 'AI Engine' },
                  { id: 'claims', label: 'Claim Review', icon: '📝', count: claims.filter(c => c.status === 'pending').length },
                  { id: 'search', label: 'Advanced Search', icon: '🔎' },
                  { id: 'analytics', label: 'Analytics & KPIs', icon: '📈' },
                  { id: 'reports', label: 'Report Generator', icon: '📑' },
                  { id: 'backups', label: 'Backup & Restore', icon: '💾' },
                  { id: 'system', label: 'Unix Monitor', icon: '💻' },
                  { id: 'logs', label: 'Activity Logs', icon: '📜' }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-lg transition-colors ${
                      activeTab === item.id
                        ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30 font-semibold'
                        : 'hover:bg-slate-800/80 hover:text-white'
                    }`}
                  >
                    <div className="flex items-center space-x-3">
                      <span className="text-base">{item.icon}</span>
                      <span>{item.label}</span>
                    </div>
                    {item.count !== undefined && item.count > 0 && (
                      <span className={`text-xs px-2 py-0.5 rounded-full font-mono ${
                        activeTab === item.id ? 'bg-blue-800 text-blue-100' : 'bg-slate-800 text-slate-400'
                      }`}>
                        {item.count}
                      </span>
                    )}
                    {item.badge && (
                      <span className="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-300">
                        {item.badge}
                      </span>
                    )}
                  </button>
                ))}
              </nav>
            </div>

            {/* Architecture Banner in Sidebar */}
            <div className="p-4 border-t border-slate-800 bg-slate-950/60">
              <div className="text-[11px] text-slate-400 space-y-1 font-mono">
                <div className="flex items-center space-x-1.5 text-blue-400 font-bold">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span>ENGINE: GNU BASH</span>
                </div>
                <div>Storage: Flat CSV Files</div>
                <div>Scripts: 9 POSIX Modules</div>
              </div>
            </div>
          </aside>

          {/* Main Content Area */}
          <div className="flex-1 flex flex-col overflow-hidden">
            {/* Top Navbar */}
            <header className="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between shadow-sm">
              <div className="flex items-center space-x-3">
                <h2 className="text-lg font-bold text-slate-900 capitalize">
                  {activeTab.replace('_', ' ')}
                </h2>
                <span className="text-xs bg-slate-100 text-slate-500 px-2 py-0.5 rounded font-mono">
                  c:\Users\manoj\Desktop\unix project
                </span>
              </div>

              {/* User Profile & Actions */}
              <div className="flex items-center space-x-3">
                <div className="flex items-center space-x-2 bg-slate-100 p-1.5 rounded-xl text-xs">
                  <span className="text-slate-500 font-semibold px-1">Active User:</span>
                  <select
                    value={user.username}
                    onChange={(e) => {
                      const val = e.target.value;
                      if (val === '__custom__') {
                        const customName = prompt('Enter your student name or username:');
                        if (customName && customName.trim()) {
                          const cleanName = customName.trim();
                          setUser({
                            username: cleanName.toLowerCase().replace(/\s+/g, '_'),
                            role: 'student',
                            full_name: cleanName,
                            email: `${cleanName.toLowerCase().replace(/\s+/g, '_')}@student.campus.edu`,
                            phone: '+91-9876543212'
                          });
                        }
                      } else {
                        const found = CAMPUS_USERS.find(u => u.username === val);
                        if (found) setUser(found);
                      }
                    }}
                    className="bg-white border border-slate-300 font-semibold text-slate-800 px-2.5 py-1 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer shadow-sm text-xs"
                  >
                    <optgroup label="Staff & Admin">
                      <option value="admin">Campus Admin (Admin)</option>
                      <option value="security_desk">Security Desk (Staff)</option>
                    </optgroup>
                    <optgroup label="Registered Students">
                      <option value="rahul_s">Rahul Sharma (Student)</option>
                      <option value="priya_p">Priya Patel (Student)</option>
                      <option value="amit_k">Amit Kumar (Student)</option>
                      <option value="sneha_r">Sneha Rao (Student)</option>
                    </optgroup>
                    <option value="__custom__">➕ Switch to Custom Name...</option>
                  </select>
                </div>

                <div className="flex items-center space-x-3 pl-2 border-l border-slate-200">
                  <div className={`w-8 h-8 rounded-full text-white font-bold flex items-center justify-center text-xs ${user.role === 'admin' ? 'bg-blue-600' : user.role === 'staff' ? 'bg-indigo-600' : 'bg-emerald-600'}`}>
                    {user.username.substring(0, 2).toUpperCase()}
                  </div>
                  <div className="text-left text-xs">
                    <p className="font-bold text-slate-800 leading-tight">{user.full_name}</p>
                    <p className="text-slate-500 capitalize">{user.role}</p>
                  </div>
                </div>
              </div>
            </header>

            {/* Scrollable View Content */}
            <main className="flex-1 overflow-y-auto p-8">
              {/* TAB 1: DASHBOARD */}
              {activeTab === 'dashboard' && (
                <div className="space-y-6 max-w-7xl mx-auto">
                  {!serverConnected && (
                    <div className="p-4 rounded-xl bg-amber-50 border border-amber-300 text-amber-800 flex items-center justify-between text-xs shadow-sm">
                      <div className="flex items-center space-x-3">
                        <span className="text-lg">⚠️</span>
                        <div>
                          <p className="font-bold">Waiting for Python API Bridge on http://localhost:5000</p>
                          <p className="text-[11px] text-amber-700 mt-0.5">Start the server in your terminal: <code className="bg-amber-100 px-1.5 py-0.5 rounded font-mono font-bold">python api/server.py</code></p>
                        </div>
                      </div>
                      <button 
                        onClick={fetchDashboardData}
                        className="px-3.5 py-1.5 bg-amber-600 text-white rounded-lg hover:bg-amber-700 font-semibold transition text-xs"
                      >
                        Retry Connection
                      </button>
                    </div>
                  )}

                  {/* Top Stats Cards */}
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                    {[
                      { label: 'Total Lost Items', val: stats?.total_lost ?? lostItems.length, color: 'text-red-600', bg: 'bg-red-50', border: 'border-red-200', icon: '🔍' },
                      { label: 'Total Found Items', val: stats?.total_found ?? foundItems.length, color: 'text-blue-600', bg: 'bg-blue-50', border: 'border-blue-200', icon: '📦' },
                      { label: 'Pending Claims', val: stats?.pending_claims ?? 0, color: 'text-amber-600', bg: 'bg-amber-50', border: 'border-amber-200', icon: '⏳' },
                      { label: 'Returned to Owners', val: stats?.returned_items ?? 0, color: 'text-emerald-600', bg: 'bg-emerald-50', border: 'border-emerald-200', icon: '✅' },
                      { label: 'Campus Recovery Rate', val: `${stats?.recovery_rate_percent ?? 0}%`, color: 'text-indigo-600', bg: 'bg-indigo-50', border: 'border-indigo-200', icon: '📈' }
                    ].map((card, i) => (
                      <div key={i} className={`p-5 rounded-2xl bg-white border ${card.border} shadow-sm flex flex-col justify-between`}>
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-semibold text-slate-500">{card.label}</span>
                          <span className={`w-8 h-8 rounded-lg ${card.bg} flex items-center justify-center text-sm`}>{card.icon}</span>
                        </div>
                        <div className={`text-3xl font-extrabold ${card.color} mt-3`}>{card.val}</div>
                      </div>
                    ))}
                  </div>

                  {/* Actions Bar */}
                  <div className="flex items-center justify-between bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                    <div>
                      <h3 className="font-bold text-slate-800 text-sm">Quick Campus Actions</h3>
                      <p className="text-xs text-slate-500">Report incidents immediately to run matching scripts</p>
                    </div>
                    <div className="flex space-x-3">
                      <button 
                        onClick={openLostModal}
                        className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-semibold shadow-sm transition flex items-center space-x-2"
                      >
                        <span>+</span>
                        <span>Report Lost Item</span>
                      </button>
                      <button 
                        onClick={openFoundModal}
                        className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold shadow-sm transition flex items-center space-x-2"
                      >
                        <span>+</span>
                        <span>Log Found Item</span>
                      </button>
                    </div>
                  </div>

                  {/* Grid of Recent Tables */}
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    {/* Recent Lost Items */}
                    <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">

                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                      <h4 className="font-bold text-slate-900 text-sm">Item Category Distribution</h4>
                      <div className="space-y-3">
                        {stats?.categories?.map((cat, i) => (
                          <div key={i} className="flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-100 text-xs">
                            <span className="font-semibold text-slate-800">{cat.category}</span>
                            <span className="bg-blue-100 text-blue-700 px-2 py-0.5 rounded font-mono font-bold">{cat.count} items</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 8: REPORT GENERATOR */}
              {activeTab === 'reports' && (
                <div className="space-y-6 max-w-7xl mx-auto">
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                    <h3 className="text-base font-bold text-slate-900">Automated Report Generator</h3>
                    <p className="text-xs text-slate-500">
                      Executes <code className="font-mono text-blue-600 font-bold">backend/report_generator.sh</code> to compile periodic analytics into <code className="font-mono">reports/</code> in both TXT and HTML format.
                    </p>
                    <div className="flex flex-wrap gap-3 pt-2">
                      <button
                        onClick={() => handleGenerateReport('daily')}
                        className="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold hover:bg-blue-700 shadow-sm transition"
                      >
                        + Generate Daily Report
                      </button>
                      <button
                        onClick={() => handleGenerateReport('weekly')}
                        className="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold hover:bg-indigo-700 shadow-sm transition"
                      >
                        + Generate Weekly Report
                      </button>
                      <button
                        onClick={() => handleGenerateReport('monthly')}
                        className="px-4 py-2 bg-purple-600 text-white rounded-xl text-xs font-semibold hover:bg-purple-700 shadow-sm transition"
                      >
                        + Generate Monthly Report
                      </button>
                    </div>
                  </div>

                  {/* Generated Reports Table */}
                  <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div className="p-4 border-b border-slate-200 flex items-center justify-between">
                      <div>
                        <h4 className="text-sm font-bold text-slate-900">Generated Reports Archive</h4>
                        <p className="text-[11px] text-slate-500">Click any report below to open or view it directly in your browser.</p>
                      </div>
                      <button 
                        onClick={fetchReports}
                        className="text-xs text-blue-600 hover:text-blue-800 font-semibold px-2.5 py-1 rounded-lg hover:bg-blue-50 transition"
                      >
                        🔄 Refresh
                      </button>
                    </div>
                    {reportsList.length === 0 ? (
                      <div className="p-8 text-center text-xs text-slate-500">
                        No reports generated yet. Click one of the buttons above to generate a report.
                      </div>
                    ) : (
                      <table className="w-full text-left text-xs">
                        <thead className="bg-slate-50 text-slate-600 border-b border-slate-200 uppercase text-[11px]">
                          <tr>
                            <th className="p-3.5">Report Filename</th>
                            <th className="p-3.5">Format</th>
                            <th className="p-3.5">File Size</th>
                            <th className="p-3.5 text-right">Action</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 font-mono">
                          {reportsList.map((r, i) => (
                            <tr key={i} className="hover:bg-slate-50">
                              <td className="p-3.5 font-bold text-slate-800">
                                <span className="mr-2">{r.type === 'html' ? '🌐' : '📄'}</span>
                                {r.filename}
                              </td>
                              <td className="p-3.5">
                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                  r.type === 'html' ? 'bg-blue-100 text-blue-800' : 'bg-slate-100 text-slate-700'
                                }`}>
                                  {r.type.toUpperCase()}
                                </span>
                              </td>
                              <td className="p-3.5 text-slate-600">{r.size}</td>
                              <td className="p-3.5 text-right">
                                <a
                                  href={r.url}
                                  target="_blank"
                                  rel="noopener noreferrer"
                                  className={`inline-flex items-center space-x-1 px-3 py-1.5 rounded-lg font-sans font-semibold text-xs transition ${
                                    r.type === 'html' 
                                      ? 'bg-blue-600 text-white hover:bg-blue-700 shadow-sm' 
                                      : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                                  }`}
                                >
                                  <span>{r.type === 'html' ? 'Open in Browser ↗' : 'View Text ↗'}</span>
                                </a>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    )}
                  </div>
                </div>
              )}

              {/* TAB 9: BACKUPS */}
              {activeTab === 'backups' && (
                <div className="space-y-6 max-w-7xl mx-auto">
                  <div className="flex items-center justify-between">
                    <div>
                      <h3 className="text-xl font-bold text-slate-900">Automated Backup & Integrity Verification</h3>
                      <p className="text-xs text-slate-500">Managed by <code className="font-mono text-blue-600 font-bold">backend/backup_restore.sh</code></p>
                    </div>
                    <button
                      onClick={handleTriggerBackup}
                      className="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold hover:bg-blue-700"
                    >
                      + Trigger Instant Snapshot
                    </button>
                  </div>

                  <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 text-slate-600 border-b border-slate-200 uppercase text-[11px]">
                        <tr>
                          <th className="p-3.5">Archive Filename</th>
                          <th className="p-3.5">Size</th>
                          <th className="p-3.5">Created Date</th>
                          <th className="p-3.5">SHA256 Integrity</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 font-mono">
                        {backups.map((b, i) => (
                          <tr key={i} className="hover:bg-slate-50">
                            <td className="p-3.5 font-bold text-slate-800">{b.filename}</td>
                            <td className="p-3.5 text-slate-600">{b.size}</td>
                            <td className="p-3.5 text-slate-500">{b.date}</td>
                            <td className="p-3.5">
                              <span className="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 font-bold text-[10px]">
                                {b.status}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* TAB 10: UNIX MONITOR */}
              {activeTab === 'system' && (
                <div className="space-y-6 max-w-7xl mx-auto">
                  <div className="flex items-center justify-between">
                    <div>
                      <h3 className="text-xl font-bold text-slate-900">Unix Host & Resource Monitor</h3>
                      <p className="text-xs text-slate-500">Collected via <code className="font-mono text-blue-600 font-bold">backend/system_monitor.sh</code></p>
                    </div>
                    <button
                      onClick={fetchSystem}
                      className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold"
                    >
                      Refresh Metrics
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                      <span className="text-xs font-bold text-slate-500 uppercase">System Hostname</span>
                      <div className="text-lg font-mono font-bold text-slate-900 mt-2">{systemInfo?.hostname || 'N/A'}</div>
                    </div>
                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                      <span className="text-xs font-bold text-slate-500 uppercase">Operating System</span>
                      <div className="text-lg font-mono font-bold text-blue-600 mt-2">{systemInfo?.os || 'Unix'}</div>
                    </div>
                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                      <span className="text-xs font-bold text-slate-500 uppercase">System Uptime</span>
                      <div className="text-sm font-mono text-slate-700 mt-2">{systemInfo?.uptime || 'Active'}</div>
                    </div>
                  </div>

                  {/* Resource Usage */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                      <h4 className="font-bold text-slate-900 text-sm">Disk Utilization</h4>
                      <div className="text-2xl font-bold font-mono text-slate-800">
                        {systemInfo?.disk?.used} / {systemInfo?.disk?.total}
                      </div>
                      <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                        <div style={{ width: `${systemInfo?.disk?.percent_used || 20}%` }} className="bg-blue-600 h-full"></div>
                      </div>
                      <div className="text-xs text-slate-500 font-mono">Available: {systemInfo?.disk?.available}</div>
                    </div>

                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                      <h4 className="font-bold text-slate-900 text-sm">Memory (RAM) Usage</h4>
                      <div className="text-2xl font-bold font-mono text-slate-800">
                        {systemInfo?.memory?.used_mb} MB / {systemInfo?.memory?.total_mb} MB
                      </div>
                      <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                        <div style={{ width: `${systemInfo?.memory?.percent_used || 30}%` }} className="bg-indigo-600 h-full"></div>
                      </div>
                      <div className="text-xs text-slate-500 font-mono">Free Memory: {systemInfo?.memory?.free_mb} MB</div>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 11: AUDIT LOGS */}
              {activeTab === 'logs' && (
                <div className="space-y-6 max-w-7xl mx-auto">
                  <div className="flex items-center justify-between">
                    <div>
                      <h3 className="text-xl font-bold text-slate-900">Application & Security Audit Stream</h3>
                      <p className="text-xs text-slate-500">Timestamped log stream from <code className="font-mono text-blue-600 font-bold">logs/audit.log</code></p>
                    </div>
                  </div>

                  <div className="bg-slate-950 p-5 rounded-2xl font-mono text-xs text-slate-300 space-y-2 max-h-[600px] overflow-y-auto border border-slate-800 shadow-2xl">
                    {logs.map((lg, i) => (
                      <div key={i} className="flex space-x-3 py-1 border-b border-slate-900">
                        <span className="text-slate-500 select-none">[{lg.timestamp}]</span>
                        <span className="text-amber-400 font-bold">[{lg.module}]</span>
                        <span className="text-emerald-400 font-semibold">{lg.user}</span>
                        <span className="text-slate-300">{lg.details}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* MODAL: Report Lost Item */}
          {showLostModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-200">
                <h3 className="text-base font-bold text-slate-900 mb-1">Report Lost Item</h3>
                <p className="text-xs text-slate-500 mb-4">Adds a new entry into <code className="font-mono">database/lost_items.csv</code></p>
                <form onSubmit={handleAddLost} className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Item Title</label>
                    <input
                      type="text"
                      required
                      value={newLost.title}
                      onChange={e => setNewLost({ ...newLost, title: e.target.value })}
                      placeholder="e.g. Dell XPS 15 Laptop"
                      className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Category</label>
                    <select
                      value={newLost.category}
                      onChange={e => setNewLost({ ...newLost, category: e.target.value })}
                      className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    >
                      <option value="Electronics">Electronics</option>
                      <option value="Personal">Personal</option>
                      <option value="Documents">Documents</option>
                      <option value="Accessories">Accessories</option>
                      <option value="Books">Books</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Description</label>
                    <textarea
                      required
                      rows="2"
                      value={newLost.description}
                      onChange={e => setNewLost({ ...newLost, description: e.target.value })}
                      placeholder="Identifying marks, color, stickers, etc."
                      className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    ></textarea>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Location Lost</label>
                    <input
                      type="text"
                      required
                      value={newLost.location}
                      onChange={e => setNewLost({ ...newLost, location: e.target.value })}
                      placeholder="e.g. Science Block Room 302"
                      className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Contact Phone Number</label>
                    <input
                      type="tel"
                      required
                      value={newLost.contact_phone}
                      onChange={e => setNewLost({ ...newLost, contact_phone: e.target.value })}
                      placeholder="+91-9876543210"
                      className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Reported By (User / ID)</label>
                      <input
                        type="text"
                        required
                        value={newLost.reported_by}
                        onChange={e => setNewLost({ ...newLost, reported_by: e.target.value })}
                        placeholder="e.g. rahul_s"
                        className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Contact Email</label>
                      <input
                        type="email"
                        required
                        value={newLost.email}
                        onChange={e => setNewLost({ ...newLost, email: e.target.value })}
                        placeholder="student@campus.edu"
                        className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono"
                      />
                    </div>
                  </div>
                  <div className="flex justify-end space-x-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowLostModal(false)}
                      className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-semibold"
                    >
                      Save Report
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: Log Found Item */}
          {showFoundModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-200">
                <h3 className="text-base font-bold text-slate-900 mb-1">Log Found Item</h3>
                <p className="text-xs text-slate-500 mb-4">Adds a new entry into <code className="font-mono">database/found_items.csv</code></p>
                <form onSubmit={handleAddFound} className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Item Title</label>
                    <input
                      type="text"
                      required
                      value={newFound.title}
                      onChange={e => setNewFound({ ...newFound, title: e.target.value })}
                      placeholder="e.g. Scientific Calculator"
                      className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Category</label>
                    <select
                      value={newFound.category}
                      onChange={e => setNewFound({ ...newFound, category: e.target.value })}
                      className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    >
                      <option value="Electronics">Electronics</option>
                      <option value="Personal">Personal</option>
                      <option value="Documents">Documents</option>
                      <option value="Accessories">Accessories</option>
                      <option value="Books">Books</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Description</label>
                    <textarea
                      required
                      rows="2"
                      value={newFound.description}
                      onChange={e => setNewFound({ ...newFound, description: e.target.value })}
                      placeholder="Found location specifics, condition, etc."
                      className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    ></textarea>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Location Found</label>
                    <input
                      type="text"
                      required
                      value={newFound.location}
                      onChange={e => setNewFound({ ...newFound, location: e.target.value })}
                      placeholder="e.g. Cafeteria Table 4"
                      className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Contact Phone / Desk Ext</label>
                    <input
                      type="tel"
                      required
                      value={newFound.contact_phone}
                      onChange={e => setNewFound({ ...newFound, contact_phone: e.target.value })}
                      placeholder="+91-9876543211"
                      className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Logged By (User / Staff)</label>
                      <input
                        type="text"
                        required
                        value={newFound.reported_by}
                        onChange={e => setNewFound({ ...newFound, reported_by: e.target.value })}
                        placeholder="e.g. security_desk"
                        className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Contact Email</label>
                      <input
                        type="email"
                        required
                        value={newFound.email}
                        onChange={e => setNewFound({ ...newFound, email: e.target.value })}
                        placeholder="security@campus.edu"
                        className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono"
                      />
                    </div>
                  </div>
                  <div className="flex justify-end space-x-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowFoundModal(false)}
                      className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold"
                    >
                      Save Found Item
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: Submit Claim */}
          {showClaimModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-200">
                <h3 className="text-base font-bold text-slate-900 mb-1">Claim Item: {showClaimModal.title}</h3>
                <p className="text-xs text-slate-500 mb-4">Item ID: <code className="font-mono">{showClaimModal.item_id}</code></p>
                <form onSubmit={handleSubmitClaim} className="space-y-4">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Claimant Name / ID</label>
                      <input
                        type="text"
                        required
                        value={claimUser}
                        onChange={e => setClaimUser(e.target.value)}
                        placeholder="e.g. rahul_s"
                        className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Your Phone Number</label>
                      <input
                        type="tel"
                        required
                        value={claimPhone}
                        onChange={e => setClaimPhone(e.target.value)}
                        placeholder="+91-9876543210"
                        className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Proof of Ownership</label>
                    <textarea
                      required
                      rows="3"
                      value={claimProof}
                      onChange={e => setClaimProof(e.target.value)}
                      placeholder="Provide specific details (serial number, wallpaper, passcode, contents, purchase invoice)"
                      className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    ></textarea>
                  </div>
                  <div className="flex justify-end space-x-2">
                    <button
                      type="button"
                      onClick={() => setShowClaimModal(null)}
                      className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold"
                    >
                      Submit Claim
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
